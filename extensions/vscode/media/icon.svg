<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    FIM Autocomplete.

    Three lines of code. The middle line is split: a solid prefix, a bright
    "ghost text" segment being filled in, and a dimmed suffix waiting after the
    cursor. That is literally what fill-in-the-middle does.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#1b2035"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g fill="#8792b8">
    <!-- line 1 -->
    <rect x="24" y="34" width="44" height="9" rx="4.5"/>
    <rect x="74" y="34" width="24" height="9" rx="4.5"/>
    <!-- line 3, indented -->
    <rect x="36" y="86" width="30" height="9" rx="4.5"/>
    <rect x="72" y="86" width="20" height="9" rx="4.5"/>
  </g>

  <!-- line 2: prefix -->
  <rect x="24" y="59" width="22" height="10" rx="5" fill="#e8ecfa"/>
  <!-- the completion being generated -->
  <rect x="52" y="59" width="34" height="10" rx="5" fill="#63d2a4"/>
  <!-- suffix, dimmed: it is already there, the model writes around it -->
  <rect x="92" y="59" width="14" height="10" rx="5" fill="#8792b8" opacity="0.45"/>

  <!-- cursor, sitting at the head of the completion -->
  <rect x="47" y="52" width="4" height="24" rx="2" fill="#e8ecfa"/>
</svg>

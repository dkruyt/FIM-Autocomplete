version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directories:
      - /core
      - /extensions/vscode
      - /packages/fetch
      - /packages/llm-info
      - /packages/openai-adapters
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode has to match the `engines.vscode` floor in
      # extensions/vscode/package.json (^1.70.0). Newer typings would let the
      # extension compile against APIs the oldest supported VS Code does not
      # have. Raise both together, deliberately, or not at all.
      - dependency-name: "@types/vscode"
    groups:
      # Provider SDKs move constantly and are only reachable through
      # llmFromProviderAndOptions; batch them into one PR.
      provider-sdks:
        patterns:
          - "@ai-sdk/*"
          - "@anthropic-ai/*"
          - "@aws-sdk/*"
          - "@google/*"
          - "ai"
          - "openai"
          - "replicate"
      dev:
        dependency-type: development

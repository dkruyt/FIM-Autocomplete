name: Bug report
description: Something is wrong with the autocomplete
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        The language and a small code sample help a lot. Where exactly was the
        cursor when the completion went wrong?
      placeholder: |
        1. Open a .ts file
        2. Type `const x = ` and pause
        3. ...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your `fim.*` settings
      description: >
        From settings.json. **Remove your `fim.apiKey`** before pasting.
      render: jsonc
      placeholder: |
        "fim.provider": "ollama",
        "fim.model": "qwen2.5-coder:1.5b",
        "fim.apiBase": "http://localhost:11434"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: vscode
    attributes:
      label: VS Code version and OS
      placeholder: "1.95.0, macOS 15.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errors from the Developer Tools console
      description: >
        **Help → Toggle Developer Tools → Console.** Paste anything red.
      render: shell
